<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Outer Architectural Aluminum Frame (Double Wall) -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="14" filter="url(#glow)" />
  <rect x="98" y="98" width="316" height="316" rx="20" fill="none" stroke="#475569" stroke-width="6" />

  <!-- Mullion & Transom (T-Kayit / Profil Grid) -->
  <line x1="256" y1="98" x2="256" y2="414" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="98" y1="230" x2="414" y2="230" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Glass Panes with Architectural Reflections -->
  <!-- Top Left Pane -->
  <rect x="110" y="110" width="134" height="108" rx="8" fill="#38bdf8" fill-opacity="0.12" />
  <line x1="124" y1="120" x2="160" y2="204" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- Top Right Pane (Tilt & Turn Openable Sash) -->
  <rect x="268" y="110" width="134" height="108" rx="8" fill="#38bdf8" fill-opacity="0.18" />
  <polygon points="274,212 335,116 396,212" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="6,4" />
  <!-- Handle -->
  <rect x="274" y="156" width="6" height="24" rx="3" fill="#ffffff" />
  <rect x="266" y="164" width="14" height="6" rx="2" fill="#ffffff" />

  <!-- Bottom Left Pane -->
  <rect x="110" y="242" width="134" height="160" rx="8" fill="#38bdf8" fill-opacity="0.12" />
  <line x1="126" y1="260" x2="175" y2="385" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Bottom Right Pane -->
  <rect x="268" y="242" width="134" height="160" rx="8" fill="#38bdf8" fill-opacity="0.12" />
  <line x1="284" y1="260" x2="333" y2="385" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="474" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="6">ALUMETRIC</text>
</svg>
