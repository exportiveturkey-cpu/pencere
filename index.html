    <title>Alumetric | Engineering & Shading Suite</title>
    <!-- We keep Tailwind CDN for simplicity, though best practice for production is PostCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Rich Dark Slate/Anthracite */
        color: #f8fafc; /* Crisp White/Slate 50 */
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      /* Custom Scrollbar for technical feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Clean and Single Custom Select Dropdown Arrow for Dark & Light modes */
      select {
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        appearance: none !important;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") !important;
        background-position: right 0.75rem center !important;
        background-size: 1.25em 1.25em !important;
        background-repeat: no-repeat !important;
        padding-right: 2.5rem !important;
        cursor: pointer;
      }

      /* RICH HIGH-CONTRAST DARK MODE (Deep Anthracite / Slate) */
      html.dark, html.dark body, body:not(.light-theme) {
        background-color: #0b1329 !important; /* Deep Rich Dark Anthracite Canvas */
        color: #f8fafc !important;
      }

      /* Dark mode card & panel backgrounds for sharp contrast */
      .dark .bg-slate-950,
      .dark .bg-slate-900,
      body:not(.light-theme) .bg-slate-950,
      body:not(.light-theme) .bg-slate-900 {
        background-color: #0f172a !important; /* Deep Slate 900 Card Background */
        border-color: #1e293b !important;
      }

      .dark .bg-slate-800,
      .dark .bg-slate-800\/50,
      .dark .bg-slate-800\/80,
      .dark .bg-slate-800\/90,
      body:not(.light-theme) .bg-slate-800,
      body:not(.light-theme) .bg-slate-800\/50,
      body:not(.light-theme) .bg-slate-800\/80,
      body:not(.light-theme) .bg-slate-800\/90 {
        background-color: #1e293b !important; /* Rich Dark Elevated Panel */
        border-color: #334155 !important;
      }

      /* Dark mode Modal Overlay */
      .dark .bg-black\/80,
      .dark .bg-slate-950\/80,
      body:not(.light-theme) .bg-black\/80,
      body:not(.light-theme) .bg-slate-950\/80 {
        background-color: rgba(11, 19, 41, 0.85) !important;
        backdrop-filter: blur(8px) !important;
      }

      /* LIGHT THEME SPECIFIC OVERRIDES (Crisp, High-Contrast Light Theme) */
      body.light-theme {
        background-color: #f8fafc !important; /* Crisp Slate 50 Canvas */
        color: #0f172a !important;
      }
      
      /* Target background color of cards & primary containers in light mode */
      body.light-theme .bg-slate-950,
      body.light-theme .bg-slate-900,
      body.light-theme [class*="bg-slate-950"],
      body.light-theme [class*="bg-slate-900"] {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #e2e8f0 !important;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05) !important;
      }
      
      /* Panels, header bars, inputs in light mode */
      body.light-theme .bg-slate-800,
      body.light-theme .bg-slate-700,
      body.light-theme [class*="bg-slate-800"],
      body.light-theme [class*="bg-slate-700"] {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }

      /* Dropdown lists inside selects & popup containers */
      body.light-theme .bg-slate-950\/80,
      body.light-theme select {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }

      body.light-theme select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23475569' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") !important;
        background-position: right 0.75rem center !important;
        background-size: 1.5em 1.5em !important;
        background-repeat: no-repeat !important;
        padding-right: 2.5rem !important;
      }

      /* Form Elements (input, textarea, select) */
      body.light-theme input,
      body.light-theme select,
      body.light-theme textarea {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
      }
      body.light-theme input::placeholder {
        color: #64748b !important;
      }

      /* Light Theme Text Contrast Enhancements - Ensures high legibility on white/light grounds */
      body.light-theme .text-white,
      body.light-theme .text-slate-100,
      body.light-theme .text-slate-200 {
        color: #0f172a !important;
      }
      body.light-theme .text-slate-300,
      body.light-theme .text-slate-400 {
        color: #334155 !important;
      }
      body.light-theme .text-slate-500,
      body.light-theme .text-slate-600 {
        color: #475569 !important;
      }

      /* High contrast colored text in light theme */
      body.light-theme .text-blue-300,
      body.light-theme .text-blue-400 {
        color: #1d4ed8 !important; /* Dark Blue */
      }
      body.light-theme .text-emerald-300,
      body.light-theme .text-emerald-400 {
        color: #047857 !important; /* Dark Emerald */
      }
      body.light-theme .text-amber-300,
      body.light-theme .text-amber-400 {
        color: #b45309 !important; /* Dark Amber */
      }
      body.light-theme .text-purple-300,
      body.light-theme .text-purple-400 {
        color: #6b21a8 !important; /* Dark Purple */
      }
      body.light-theme .text-indigo-300,
      body.light-theme .text-indigo-400 {
        color: #3730a3 !important; /* Dark Indigo */
      }

      /* Light Mode Alert & Highlight Boxes - High contrast backgrounds */
      body.light-theme .bg-blue-500\/10,
      body.light-theme .bg-blue-900\/20 {
        background-color: #eff6ff !important;
        border-color: #bfdbfe !important;
      }
      body.light-theme .bg-emerald-500\/10,
      body.light-theme .bg-emerald-900\/20 {
        background-color: #ecfdf5 !important;
        border-color: #a7f3d0 !important;
      }
      body.light-theme .bg-amber-500\/10,
      body.light-theme .bg-amber-900\/20 {
        background-color: #fffbeb !important;
        border-color: #fde68a !important;
      }
      body.light-theme .bg-purple-500\/10,
      body.light-theme .bg-purple-900\/20 {
        background-color: #faf5ff !important;
        border-color: #e9d5ff !important;
      }
      body.light-theme .text-slate-600 {
        color: #475569 !important;
      }

      /* Border adjustments */
      body.light-theme .border-slate-800,
      body.light-theme .border-slate-700,
      body.light-theme .border-white\/5,
      body.light-theme .border-white\/10,
      body.light-theme .border-slate-800\/80,
      body.light-theme .border-slate-800\/60 {
        border-color: #e2e8f0 !important;
      }

      /* Scrollbar Light mode adjustment */
      body.light-theme ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      body.light-theme ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
      }
      body.light-theme ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Keep positive alert components untouched */
      body.light-theme .bg-emerald-500\/10 {
        background-color: rgba(16, 185, 129, 0.1) !important;
      }
      body.light-theme .bg-blue-500\/10 {
        background-color: rgba(59, 130, 246, 0.1) !important;
      }
      body.light-theme .bg-purple-500\/10 {
        background-color: rgba(168, 85, 247, 0.1) !important;
      }

      /* PRINT OPTIMIZATIONS */
      @media print {
        @page {
          margin: 10mm;
          size: A4 portrait;
        }
        html, body, #root, #root > div {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          display: block !important;
          position: relative !important;
          width: 100% !important;
          background: white !important;
          color: black !important;
        }
        /* ensure the main scrolling elements do not lock scrolling/display */
        .overflow-y-auto {
          overflow: visible !important;
          height: auto !important;
          min-height: 0 !important;
        }
        /* Specific rules for quote drawings and section images */
        .quote-elevation-box {
          width: 230px !important;
          height: 230px !important;
          max-width: 230px !important;
          max-height: 230px !important;
          min-width: 230px !important;
          min-height: 230px !important;
          overflow: hidden !important;
        }
        .quote-boykesit-box {
          width: 48px !important;
          height: 230px !important;
          max-width: 48px !important;
          max-height: 230px !important;
          min-width: 48px !important;
          min-height: 230px !important;
          overflow: hidden !important;
        }
        .quote-boykesit-box img {
          max-height: 210px !important;
          max-width: 44px !important;
          object-fit: contain !important;
          height: auto !important;
          width: auto !important;
        }
        .quote-plankesit-box {
          width: 286px !important;
          height: 48px !important;
          max-width: 286px !important;
          max-height: 48px !important;
          min-height: 48px !important;
          overflow: hidden !important;
        }
        .quote-plankesit-box img {
          max-height: 44px !important;
          max-width: 280px !important;
          object-fit: contain !important;
          height: auto !important;
          width: auto !important;
        }
        .flex {
          display: flex !important;
        }
        /* Reset root layout flex/height to block to allow natural page breaks */
        .flex.h-full.bg-slate-950, 
        .flex-1.flex.flex-col.h-full {
          display: block !important;
          height: auto !important;
          background: white !important;
        }
        body {
          background-color: white !important;
          color: black !important;
        }
        .print\:hidden {
          display: none !important;
        }
        .print\:bg-white {
          background-color: white !important;
        }
        .print\:text-black {
          color: black !important;
        }
        .print\:border-slate-200 {
          border-color: #e2e8f0 !important;
        }
        .avoid-break, .print\:break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid-page !important;
        }
      }
    </style>
