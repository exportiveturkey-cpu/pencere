    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #e2e8f0; /* Slate 200 */
      }
      /* Custom Scrollbar for technical feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* LIGHT THEME SPECIFIC OVERRIDES */
      body.light-theme {
        background-color: #f1f5f9 !important; /* Soft premium grey */
        color: #0f172a !important;
      }
      
      /* Target background color of pages & primary containers */
      body.light-theme .bg-slate-950,
      body.light-theme .bg-slate-900\/40,
      body.light-theme .bg-slate-900,
      body.light-theme .h-screen.w-full.fixed.top-0.left-0.z-50.bg-slate-900 {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }
      
      body.light-theme .bg-slate-900\/50,
      body.light-theme .bg-slate-900\/60,
      body.light-theme .bg-slate-950\/40,
      body.light-theme .bg-slate-950\/60 {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      /* Dark panels / navigation items / edit bars */
      body.light-theme .bg-slate-800,
      body.light-theme .bg-slate-800\/50,
      body.light-theme .bg-slate-800\/80 {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
      }

      /* Dropdown lists inside selects & popup containers */
      body.light-theme .bg-slate-950\/80 {
        background-color: rgba(255, 255, 255, 0.95) !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }

      body.light-theme select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") !important;
        background-position: right 0.75rem center !important;
        background-size: 1.5em 1.5em !important;
        background-repeat: no-repeat !important;
        padding-right: 2.5rem !important;
      }

      /* Form Elements (input, textarea, select) */
      body.light-theme input,
      body.light-theme select,
      body.light-theme textarea {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
      }
      body.light-theme input::placeholder {
        color: #94a3b8 !important;
      }

      /* Text color overrides */
      body.light-theme .text-white,
      body.light-theme .text-slate-100,
      body.light-theme .text-slate-200,
      body.light-theme .text-slate-300 {
        color: #0f172a !important;
      }
      body.light-theme .text-slate-400,
      body.light-theme .text-slate-500 {
        color: #475569 !important;
      }
      body.light-theme .text-slate-600 {
        color: #64748b !important;
      }

      /* Border adjustments */
      body.light-theme .border-slate-800,
      body.light-theme .border-slate-700,
      body.light-theme .border-white\/5,
      body.light-theme .border-white\/10,
      body.light-theme .border-slate-800\/80 {
        border-color: #cbd5e1 !important;
      }

      /* Scrollbar Light mode adjustment */
      body.light-theme ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      body.light-theme ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
      }
      body.light-theme ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Keep positive alert components untouched */
      body.light-theme .bg-emerald-500\/10 {
        background-color: rgba(16, 185, 129, 0.1) !important;
      }
      body.light-theme .bg-blue-500\/10 {
        background-color: rgba(59, 130, 246, 0.1) !important;
      }
      body.light-theme .bg-purple-500\/10 {
        background-color: rgba(168, 85, 247, 0.1) !important;
      }

      /* PRINT OPTIMIZATIONS */
      @media print {
        @page {
          margin: 10mm;
          size: A4 portrait;
        }
        html, body, #root, #root > div {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          display: block !important;
          position: relative !important;
          width: 100% !important;
          background: white !important;
          color: black !important;
        }
        /* ensure the main scrolling elements do not lock scrolling/display */
        .overflow-hidden, .overflow-y-auto {
          overflow: visible !important;
          height: auto !important;
          min-height: 0 !important;
        }
        .flex {
          display: flex !important;
        }
        /* Reset root layout flex/height to block to allow natural page breaks */
        .flex.h-full.bg-slate-950, 
        .flex-1.flex.flex-col.h-full {
          display: block !important;
          height: auto !important;
          background: white !important;
        }
        body {
          background-color: white !important;
          color: black !important;
        }
        .print\:hidden {
          display: none !important;
        }
        .print\:bg-white {
          background-color: white !important;
        }
        .print\:text-black {
          color: black !important;
        }
        .print\:border-slate-200 {
          border-color: #e2e8f0 !important;
        }
        .avoid-break, .print\:break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid-page !important;
        }
      }
    </style>
